        <dialog id="dialog-modal">
            <div class="dialog-wrapper">
                <form class="book-form">
                    <h2>Add a book</h2>
                    <div class="form-field">
                        <label for="form-title">Title</label>
                        <input type="text" name="title" id="form-title" placeholder="Project Hail Mary" required>
                    </div>
                    <div class="form-field">
                        <label for=form-author>Author</label>
                        <input type="text" name="author" id="form-author" placeholder="Andy Weir" required>
                    </div>
                    <div class="form-field">
                        <label for="form-pages">pages</label>
                        <input type="number" name="pages" id="form-pages" placeholder="496" required>
                    </div>
                    <div class="read-status">
                        <input type="checkbox" class="read-toggle" id="modal-toggle" name="read">
                        <p data-toggle-id="modal-toggle" class="modal-read-state">Not read</p>
                    </div>
                    <div class="form-btns">
                        <button type="button" id="close-modal">Cancel</button>
                        <button type="submit">Add Book</button>
                    </div>
                </form>
            </div>
        </dialog>
